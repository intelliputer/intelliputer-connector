<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1450" viewBox="0 0 2400 1450" role="img" aria-labelledby="title description">
  <title id="title">Intelliputer Connector card-edge pin IDs</title>
  <desc id="description">Front and back views of the 44-contact Intellivision cartridge card edge. The insertion edge is at the bottom. The front has even contacts and the back has odd contacts.</desc>
  <style>
    .background { fill: #f5f1e8; }
    .heading { font: 700 58px sans-serif; fill: #172a3a; }
    .subheading { font: 600 32px sans-serif; fill: #243f52; }
    .note { font: 26px sans-serif; fill: #3c5263; }
    .board { fill: #19734c; stroke: #0e422d; stroke-width: 12; }
    .board-back { fill: #155f43; stroke: #0e422d; stroke-width: 12; }
    .silk { fill: #f4f0d3; font: 600 23px sans-serif; letter-spacing: 2px; }
    .copper { fill: #d6a747; stroke: #895e1d; stroke-width: 3; }
    .contact-number { font: 700 23px sans-serif; fill: #172a3a; text-anchor: middle; }
    .edge-label { font: 600 24px sans-serif; fill: #f4f0d3; text-anchor: middle; }
    .header { fill: #172a3a; stroke: #08131b; stroke-width: 5; }
    .hole { fill: #e9e4d5; stroke: #08131b; stroke-width: 4; }
    .pin-one { fill: #ce4242; }
  </style>
  <defs>
    <!-- One J2 column: J2 has 22 columns of two plated-through holes. -->
    <g id="header-column" class="hole">
      <circle cy="405" r="12"/>
      <circle cy="445" r="12"/>
    </g>
  </defs>
  <rect class="background" width="2400" height="1450"/>
  <text class="heading" x="1200" y="95" text-anchor="middle">INTELLIPUTER CONNECTOR — CARTRIDGE-EDGE PIN IDENTITY</text>
  <text class="note" x="1200" y="145" text-anchor="middle">Contact-side views; keep the card edge at the bottom. Pin 1 is the square J2 pad.</text>

  <!-- Front, F.Cu: even contacts. -->
  <g transform="translate(145,235)">
    <text class="subheading" x="500" y="0" text-anchor="middle">TOP / F.Cu — EVEN PINS</text>
    <text class="note" x="500" y="43" text-anchor="middle">Component/silkscreen side; inserted component side up. Pin 2 is at the right.</text>
    <path class="board" d="M65 115 H935 V815 L855 900 H145 L65 815 Z"/>
    <text class="silk" x="500" y="265" text-anchor="middle">INTELLIPUTER CONNECTOR</text>
    <text class="silk" x="500" y="300" text-anchor="middle">TOP / F.Cu</text>
    <rect class="header" x="170" y="375" width="660" height="100" rx="8"/>
    <g>
      <use href="#header-column" x="185"/><use href="#header-column" x="215"/><use href="#header-column" x="245"/><use href="#header-column" x="275"/><use href="#header-column" x="305"/><use href="#header-column" x="335"/><use href="#header-column" x="365"/><use href="#header-column" x="395"/><use href="#header-column" x="425"/><use href="#header-column" x="455"/><use href="#header-column" x="485"/><use href="#header-column" x="515"/><use href="#header-column" x="545"/><use href="#header-column" x="575"/><use href="#header-column" x="605"/><use href="#header-column" x="635"/><use href="#header-column" x="665"/><use href="#header-column" x="695"/><use href="#header-column" x="725"/><use href="#header-column" x="755"/><use href="#header-column" x="785"/><use href="#header-column" x="815"/>
      <rect class="pin-one" x="803" y="433" width="24" height="24" rx="2"/>
    </g>
    <g class="copper">
      <rect x="150" y="700" width="28" height="160"/><rect x="184" y="700" width="28" height="160"/><rect x="218" y="700" width="28" height="160"/><rect x="252" y="700" width="28" height="160"/><rect x="286" y="700" width="28" height="160"/><rect x="320" y="700" width="28" height="160"/><rect x="354" y="700" width="28" height="160"/><rect x="388" y="700" width="28" height="160"/><rect x="422" y="700" width="28" height="160"/><rect x="456" y="700" width="28" height="160"/><rect x="490" y="700" width="28" height="160"/><rect x="524" y="700" width="28" height="160"/><rect x="558" y="700" width="28" height="160"/><rect x="592" y="700" width="28" height="160"/><rect x="626" y="700" width="28" height="160"/><rect x="660" y="700" width="28" height="160"/><rect x="694" y="700" width="28" height="160"/><rect x="728" y="700" width="28" height="160"/><rect x="762" y="700" width="28" height="160"/><rect x="796" y="700" width="28" height="160"/><rect x="830" y="700" width="28" height="160"/><rect x="864" y="700" width="28" height="160"/>
    </g>
    <g class="contact-number">
      <text x="164" y="680">44</text><text x="198" y="680">42</text><text x="232" y="680">40</text><text x="266" y="680">38</text><text x="300" y="680">36</text><text x="334" y="680">34</text><text x="368" y="680">32</text><text x="402" y="680">30</text><text x="436" y="680">28</text><text x="470" y="680">26</text><text x="504" y="680">24</text><text x="538" y="680">22</text><text x="572" y="680">20</text><text x="606" y="680">18</text><text x="640" y="680">16</text><text x="674" y="680">14</text><text x="708" y="680">12</text><text x="742" y="680">10</text><text x="776" y="680">8</text><text x="810" y="680">6</text><text x="844" y="680">4</text><text x="878" y="680">2</text>
    </g>
    <text class="edge-label" x="500" y="890">CARD EDGE / INSERTION END</text>
  </g>

  <!-- Back, B.Cu: odd contacts. The board has been flipped for a usable back-side view. -->
  <g transform="translate(1255,235)">
    <text class="subheading" x="500" y="0" text-anchor="middle">BOTTOM / B.Cu — ODD PINS</text>
    <text class="note" x="500" y="43" text-anchor="middle">Solder side; flipped to retain the edge-down view, so pin 1 is at the left.</text>
    <path class="board-back" d="M65 115 H935 V815 L855 900 H145 L65 815 Z"/>
    <text class="silk" x="500" y="265" text-anchor="middle">INTELLIPUTER CONNECTOR</text>
    <text class="silk" x="500" y="300" text-anchor="middle">BOTTOM / B.Cu</text>
    <rect class="header" x="170" y="375" width="660" height="100" rx="8"/>
    <g>
      <use href="#header-column" x="185"/><use href="#header-column" x="215"/><use href="#header-column" x="245"/><use href="#header-column" x="275"/><use href="#header-column" x="305"/><use href="#header-column" x="335"/><use href="#header-column" x="365"/><use href="#header-column" x="395"/><use href="#header-column" x="425"/><use href="#header-column" x="455"/><use href="#header-column" x="485"/><use href="#header-column" x="515"/><use href="#header-column" x="545"/><use href="#header-column" x="575"/><use href="#header-column" x="605"/><use href="#header-column" x="635"/><use href="#header-column" x="665"/><use href="#header-column" x="695"/><use href="#header-column" x="725"/><use href="#header-column" x="755"/><use href="#header-column" x="785"/><use href="#header-column" x="815"/>
      <rect class="pin-one" x="173" y="433" width="24" height="24" rx="2"/>
    </g>
    <g class="copper">
      <rect x="150" y="700" width="28" height="160"/><rect x="184" y="700" width="28" height="160"/><rect x="218" y="700" width="28" height="160"/><rect x="252" y="700" width="28" height="160"/><rect x="286" y="700" width="28" height="160"/><rect x="320" y="700" width="28" height="160"/><rect x="354" y="700" width="28" height="160"/><rect x="388" y="700" width="28" height="160"/><rect x="422" y="700" width="28" height="160"/><rect x="456" y="700" width="28" height="160"/><rect x="490" y="700" width="28" height="160"/><rect x="524" y="700" width="28" height="160"/><rect x="558" y="700" width="28" height="160"/><rect x="592" y="700" width="28" height="160"/><rect x="626" y="700" width="28" height="160"/><rect x="660" y="700" width="28" height="160"/><rect x="694" y="700" width="28" height="160"/><rect x="728" y="700" width="28" height="160"/><rect x="762" y="700" width="28" height="160"/><rect x="796" y="700" width="28" height="160"/><rect x="830" y="700" width="28" height="160"/><rect x="864" y="700" width="28" height="160"/>
    </g>
    <g class="contact-number">
      <text x="164" y="680">1</text><text x="198" y="680">3</text><text x="232" y="680">5</text><text x="266" y="680">7</text><text x="300" y="680">9</text><text x="334" y="680">11</text><text x="368" y="680">13</text><text x="402" y="680">15</text><text x="436" y="680">17</text><text x="470" y="680">19</text><text x="504" y="680">21</text><text x="538" y="680">23</text><text x="572" y="680">25</text><text x="606" y="680">27</text><text x="640" y="680">29</text><text x="674" y="680">31</text><text x="708" y="680">33</text><text x="742" y="680">35</text><text x="776" y="680">37</text><text x="810" y="680">39</text><text x="844" y="680">41</text><text x="878" y="680">43</text>
    </g>
    <text class="edge-label" x="500" y="890">CARD EDGE / INSERTION END</text>
  </g>
  <text class="note" x="1200" y="1245" text-anchor="middle">Every card-edge contact connects directly to the identically numbered J2 header pin. This drawing identifies physical contacts only.</text>
  <text class="note" x="1200" y="1290" text-anchor="middle">The attached circuit must provide any required conventional control-line loopbacks: 38→36, 40→34, and 42→32.</text>
</svg>
